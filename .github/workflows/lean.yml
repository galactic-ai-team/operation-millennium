name: Lean 4 Verification (Optional)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'

jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan with the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build (prints #print axioms output)
        run: lake build 2>&1 | tee ../lean-build.log

      - name: Reject sorry / sorryAx
        run: |
          ! grep -rn "sorry" Millennium/
          ! grep -n "sorryAx" ../lean-build.log
