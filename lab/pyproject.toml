[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "om-lab"
version = "0.1.0"
description = "Phase 2 computational laboratory for Operation Millennium (NP-complete generators, SAT solvers, and phase-transition experiments)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-sat>=1.8",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["om_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
